name: Profile stats

on:
  schedule:
    # Every day at 05:23 UTC (02:23 BRT).
    - cron: "23 5 * * *"
  workflow_dispatch:
  # So the cards exist from the first push instead of waiting for the cron.
  # The commit this job makes is authored by GITHUB_TOKEN, and pushes made with
  # that token do not trigger workflows — so this cannot recurse. paths-ignore
  # is a second guard in case the job is ever switched to a PAT.
  push:
    branches: [main]
    paths-ignore:
      - "profile-summary-card-output/**"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The README references two themes. Generating all ~20 would bloat the
      # repository, but the action only takes one THEME per run and each run
      # wipes the output directory — so each theme is generated in turn and
      # parked outside the workspace, then committed together at the end.
      - name: Generate cards (dark)
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # The built-in token is enough because every card reads public data.
          # If a run ever fails on rate limits, create a PAT with public_repo
          # scope, store it as SUMMARY_GITHUB_TOKEN and swap it in here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: -3
          THEME: github_dark
          ANIMATION: load
          AUTO_PUSH: false

      - name: Park the dark cards
        run: |
          set -eux
          ls -R profile-summary-card-output
          mkdir -p /tmp/cards
          cp -r profile-summary-card-output/github_dark /tmp/cards/github_dark

      - name: Generate cards (light)
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: -3
          THEME: github
          ANIMATION: load
          AUTO_PUSH: false

      - name: Commit both themes
        run: |
          set -eux
          cp -r /tmp/cards/github_dark profile-summary-card-output/github_dark
          test -f profile-summary-card-output/github_dark/3-stats.svg
          test -f profile-summary-card-output/github/3-stats.svg
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          git diff --staged --quiet && echo "cards unchanged" && exit 0
          git commit -m "Generate profile summary cards"
          git push
