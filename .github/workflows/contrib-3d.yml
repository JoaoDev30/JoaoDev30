name: 3D contribution calendar

on:
  schedule:
    # Every day at 05:41 UTC (02:41 BRT).
    - cron: "41 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "profile-3d-contrib/**"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Runs on the built-in token: every figure it draws is public profile data.
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit the two variants the README uses
        run: |
          set -eux
          # The action emits ten colour variants; only the light/dark pair the
          # README references is committed, to keep the repository small.
          test -f profile-3d-contrib/profile-green-animate.svg
          test -f profile-3d-contrib/profile-night-green.svg
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force \
            profile-3d-contrib/profile-green-animate.svg \
            profile-3d-contrib/profile-night-green.svg
          git diff --staged --quiet && echo "calendar unchanged" && exit 0
          git commit -m "Generate 3D contribution calendar"
          git push
