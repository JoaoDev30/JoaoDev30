<svg xmlns="http://www.w3.org/2000/svg" width="820" height="278" viewBox="0 0 820 278" role="img" aria-label="João Miguel — Software Developer. Java 21, Spring Boot, PostgreSQL, Docker, AWS. Backend systems, REST APIs and real-world automation.">
  <style>
    .bg     { fill: #ffffff; }
    .stroke { stroke: #d1d9e0; }
    .bar    { fill: #f6f8fa; }
    .dim    { fill: #818b98; }
    .muted  { fill: #59636e; }
    .fg     { fill: #1f2328; }
    .accent { fill: #0969da; }
    .cursor { fill: #0969da; }

    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 14.5px;
    }
    .tiny { font-size: 11.5px; letter-spacing: .4px; }
    .name { font-size: 19px; font-weight: 700; }

    /* Base state is fully visible: if a renderer ignores CSS animation,
       the terminal still reads as a finished, complete frame. */
    .type  { animation: type 620ms steps(24) var(--d) backwards; transform-origin: 30px 0; }
    .rise  { animation: rise 420ms ease-out var(--d) backwards; }
    .blink { animation: blink 1.05s steps(1) 3.4s infinite backwards; }

    @keyframes type  { from { transform: scaleX(0); } }
    @keyframes rise  { from { opacity: 0; transform: translateY(5px); } }
    @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .type, .rise, .blink { animation: none; }
    }
  </style>

  <clipPath id="l1"><rect class="type" style="--d:.15s"  x="30" y="60"  width="300" height="22"/></clipPath>
  <clipPath id="l3"><rect class="type" style="--d:1.25s" x="30" y="126" width="300" height="22"/></clipPath>
  <clipPath id="l5"><rect class="type" style="--d:2.35s" x="30" y="192" width="300" height="22"/></clipPath>

  <rect class="bg stroke" x=".5" y=".5" width="819" height="277" rx="11"/>
  <path class="bar" d="M.5 11.5A11 11 0 0 1 11.5.5h797A11 11 0 0 1 819.5 11.5V40H.5z"/>
  <line class="stroke" x1="0" y1="40.5" x2="820" y2="40.5"/>

  <circle cx="24" cy="20.5" r="5" fill="#ff5f57"/>
  <circle cx="42" cy="20.5" r="5" fill="#febc2e"/>
  <circle cx="60" cy="20.5" r="5" fill="#28c840"/>
  <text class="mono tiny dim" x="410" y="24.5" text-anchor="middle">joaodev30 — ~/dev</text>

  <g clip-path="url(#l1)">
    <text class="mono" x="30" y="76"><tspan class="accent">$</tspan><tspan class="fg" dx="9">whoami</tspan></text>
  </g>
  <text class="mono name fg rise" style="--d:.85s" x="30" y="107">João Miguel</text>
  <text class="mono muted rise" style="--d:.95s" x="188" y="106">Software Developer</text>

  <g clip-path="url(#l3)">
    <text class="mono" x="30" y="142"><tspan class="accent">$</tspan><tspan class="fg" dx="9">cat stack.txt</tspan></text>
  </g>
  <text class="mono muted rise" style="--d:1.95s" x="30" y="171">Java 21 · Spring Boot · PostgreSQL · Docker · AWS</text>

  <g clip-path="url(#l5)">
    <text class="mono" x="30" y="208"><tspan class="accent">$</tspan><tspan class="fg" dx="9">focus --now</tspan></text>
  </g>
  <text class="mono muted rise" style="--d:3.05s" x="30" y="237">Backend systems, REST APIs and automation for real problems</text>

  <rect class="cursor blink" x="30" y="253" width="9" height="16" rx="1"/>
</svg>
